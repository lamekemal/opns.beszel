[start]
command:/usr/local/etc/rc.d/beszel_agent start
parameters:
type:script
message:Starting Beszel Agent service

[stop]
command:/usr/local/etc/rc.d/beszel_agent stop
parameters:
type:script
message:Stopping Beszel Agent service

[restart]
command:/usr/local/etc/rc.d/beszel_agent restart
parameters:
type:script
message:Restarting Beszel Agent service

[status]
command:/usr/local/etc/rc.d/beszel_agent status; exit 0
parameters:
type:script_output
message:Requesting Beszel Agent service status

[reconfigure]
command:/usr/local/opnsense/scripts/OPNsense/BeszelAgent/reconfigure.sh
parameters:
type:script
message:Reconfiguring Beszel Agent service

[log]
command:tail -n
parameters:%s /var/log/beszel-agent.log
type:script_output
message:Fetching Beszel Agent log
